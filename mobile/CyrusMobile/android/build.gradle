buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        // 24 (Android 7.0, 2016) minimum, releve de 21 : impose par
        // react-native-webview (voir WebViewTest.tsx) — aucune perte de
        // compatibilite reelle en 2026, la quasi-totalite du parc Android
        // actif est deja au-dela de cette version.
        minSdkVersion = 24
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "25.1.8937393"
        kotlinVersion = "1.8.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
