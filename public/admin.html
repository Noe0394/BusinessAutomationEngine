<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Portail Administrateur</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: sans-serif; margin: 0; background: #f2f2f3; color: #1a1a1a; }
    button, input, select, textarea { font-family: inherit; font-size: 1rem; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: #1a1a2e; color: #fff; flex-wrap: wrap; gap: 0.5rem; }
    header h1 { margin: 0; font-size: 1.15rem; }
    header button { background: #fff; color: #1a1a2e; border: none; padding: 0.6rem 1rem; border-radius: 6px; cursor: pointer; min-height: 44px; }

    #login-screen { max-width: 340px; margin: 3rem auto; padding: 2rem 1.5rem; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); text-align: center; }
    #login-screen input { width: 100%; padding: 0.75rem; margin-bottom: 1rem; min-height: 44px; border: 1px solid #ccc; border-radius: 6px; }
    #login-screen button { width: 100%; padding: 0.75rem; background: #1a1a2e; color: #fff; border: none; border-radius: 6px; cursor: pointer; min-height: 44px; }
    .error { color: #c0392b; }

    main { max-width: 1000px; margin: 1.5rem auto; padding: 0 1rem; }
    section { background: #fff; padding: 1.25rem; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 1.5rem; }

    .overview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
    .overview-card { background: #f7f7fb; border-radius: 8px; padding: 1rem; text-align: center; }
    .overview-card .value { font-size: 1.8rem; font-weight: bold; color: #1a1a2e; }
    .overview-card .label { color: #666; font-size: 0.85rem; margin-top: 0.25rem; }

    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; min-width: 640px; }
    th, td { border: 1px solid #e0e0e0; padding: 0.6rem 0.75rem; text-align: left; }
    th { background: #f5f5f5; }
    button { cursor: pointer; min-height: 40px; }
    .empty { color: #777; }

    .badge { display: inline-block; padding: 0.3rem 0.8rem; border-radius: 999px; font-weight: bold; font-size: 0.85rem; }
    .badge.connected { background: #d4f5dd; color: #1a7a3c; }
    .badge.disconnected { background: #eee; color: #777; }
    .status-delivered { color: #1a7a3c; font-weight: bold; }
    .status-failed { color: #c0392b; font-weight: bold; }
    .cause-ok { color: #1a7a3c; }
    .cause-bad { color: #c0392b; }

    .manage-row td { background: #f9f9fc; padding: 1rem; }
    .manage-row .field { margin-bottom: 0.75rem; }
    .manage-row label.mod { font-weight: normal; display: inline-block; margin-right: 1rem; }

    .field { margin-bottom: 1rem; }
    .field label { display: block; font-weight: bold; margin-bottom: 0.3rem; }
    .field input[type="text"], .field input[type="date"], .field select {
      width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; min-height: 44px;
    }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .row .field { flex: 1; min-width: 200px; }

    .primary-btn { background: #1a1a2e; color: #fff; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: bold; }

    @media (max-width: 640px) {
      header { flex-direction: column; align-items: stretch; text-align: center; }
    }
  </style>
</head>
<body>
  <div id="login-screen">
    <h1>🛡️ Portail Administrateur</h1>
    <form id="login-form">
      <input type="password" id="login-password" placeholder="Mot de passe administrateur" required />
      <button type="submit">Entrer</button>
    </form>
    <p id="login-error" class="error" hidden></p>
  </div>

  <div id="app" hidden>
    <header>
      <h1>🛡️ Portail Administrateur</h1>
      <button id="logout-btn" type="button">Se déconnecter</button>
    </header>

    <main>
      <section>
        <h2>Vue d'ensemble</h2>
        <div class="overview-grid">
          <div class="overview-card"><div class="value" id="overview-total">-</div><div class="label">Clés générées</div></div>
          <div class="overview-card"><div class="value" id="overview-active">-</div><div class="label">Clés actives</div></div>
          <div class="overview-card"><div class="value" id="overview-online">-</div><div class="label">Connectés maintenant</div></div>
          <div class="overview-card"><div class="value" id="overview-requests">-</div><div class="label">Requêtes cumulées</div></div>
        </div>
        <div id="storage-status" style="margin: 1rem 0 0; display: flex; flex-direction: column; gap: 0.5rem;">
          <p id="storage-status-licenses" style="margin: 0; padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.9rem;"></p>
          <p id="storage-status-whatsapp" style="margin: 0; padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.9rem;"></p>
          <p id="storage-status-telegram" style="margin: 0; padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.9rem;"></p>
        </div>
      </section>

      <section>
        <h2>Générer une nouvelle clé</h2>

        <div class="field">
          <label>Durée de validité</label>
          <div class="row">
            <div class="field">
              <input type="number" id="new-license-duration-value" value="30" min="0" />
            </div>
            <div class="field">
              <select id="new-license-duration-unit">
                <option value="hours">Heure(s)</option>
                <option value="days" selected>Jour(s)</option>
                <option value="months">Mois</option>
                <option value="years">Année(s)</option>
                <option value="unlimited">Illimitée</option>
              </select>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="new-license-quantity">Nombre de clés à générer</label>
            <input type="number" id="new-license-quantity" value="1" min="1" max="100" />
          </div>
          <div class="field">
            <label for="new-license-note">Note (optionnel, appliquée à toutes les clés du lot)</label>
            <input type="text" id="new-license-note" placeholder="Ex: client Dupont" />
          </div>
        </div>

        <div class="field">
          <label>Modules inclus (une même clé peut couvrir plusieurs fonctionnalités)</label>
          <label><input type="checkbox" class="new-license-module" value="whatsapp" /> WhatsApp Automation</label>
          <label style="margin-left: 1.5rem;"><input type="checkbox" class="new-license-module" value="telegram" /> Telegram Engine</label>
          <label style="margin-left: 1.5rem;"><input type="checkbox" class="new-license-module" value="studio_video" /> Studio IA (Média/Vidéo/Livres)</label>
          <br />
          <button type="button" id="select-all-modules-btn" style="margin-top: 0.5rem;">Tout sélectionner</button>
          <button type="button" id="deselect-all-modules-btn">Tout désélectionner</button>
        </div>

        <button type="button" id="generate-license-btn" class="primary-btn">➕ Générer</button>
        <p id="generate-feedback" hidden></p>
      </section>

      <section>
        <h2>Clés existantes</h2>
        <div class="field" style="margin-bottom: 1rem;">
          <label for="license-search">Rechercher une clé (par code ou par note)</label>
          <input type="text" id="license-search" placeholder="Ex: KEY-AFFFF2D9-2026 ou &quot;client Dupont&quot;" />
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Clé</th><th>Créée le</th><th>Expire le</th><th>Statut</th><th>Cause</th><th>En ligne</th>
                <th>Requêtes</th><th>Modules</th><th>Appareil</th><th>Note</th><th>Action</th>
              </tr>
            </thead>
            <tbody id="licenses-body">
              <tr><td colspan="11" class="empty">Chargement...</td></tr>
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <script>
    const STORAGE_KEY = 'admin_portal_password';
    const MODULE_LABELS = {
      whatsapp: 'WhatsApp',
      telegram: 'Telegram',
      studio_video: 'Studio IA',
    };
    let pollInterval = null;

    function getStoredPassword() {
      try { return localStorage.getItem(STORAGE_KEY) || ''; } catch (err) { return ''; }
    }
    function setStoredPassword(pw) {
      try { localStorage.setItem(STORAGE_KEY, pw); } catch (err) { /* stockage indisponible */ }
    }
    function clearStoredPassword() {
      try { localStorage.removeItem(STORAGE_KEY); } catch (err) { /* stockage indisponible */ }
    }

    async function apiFetch(url, options) {
      options = options || {};
      const headers = Object.assign({}, options.headers || {}, { 'x-admin-password': getStoredPassword() });
      const res = await fetch(url, Object.assign({}, options, { headers }));
      if (res.status === 401) {
        showLogin('Session expirée ou mot de passe invalide.');
        throw new Error('unauthorized');
      }
      return res;
    }

    function showLogin(errorMessage) {
      if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
      document.getElementById('app').hidden = true;
      document.getElementById('login-screen').hidden = false;
      const errEl = document.getElementById('login-error');
      if (errorMessage) { errEl.textContent = errorMessage; errEl.hidden = false; } else { errEl.hidden = true; }
    }
    function showApp() {
      document.getElementById('login-screen').hidden = true;
      document.getElementById('app').hidden = false;
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('login-password').value;
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        const data = await res.json();
        if (!res.ok) {
          document.getElementById('login-error').textContent = data.error || 'Mot de passe incorrect.';
          document.getElementById('login-error').hidden = false;
          return;
        }
        setStoredPassword(password);
        showApp();
        init();
      } catch (err) {
        document.getElementById('login-error').textContent = 'Erreur de connexion au serveur.';
        document.getElementById('login-error').hidden = false;
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      clearStoredPassword();
      showLogin();
    });

    async function tryAutoLogin() {
      const pw = getStoredPassword();
      if (!pw) { showLogin(); return false; }
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw }),
        });
        if (res.ok) { showApp(); return true; }
      } catch (err) { /* réseau indisponible */ }
      clearStoredPassword();
      showLogin();
      return false;
    }

    async function loadOverview() {
      try {
        const res = await apiFetch('/api/admin/overview');
        const data = await res.json();
        document.getElementById('overview-total').textContent = data.totalKeys;
        document.getElementById('overview-active').textContent = data.activeKeys;
        document.getElementById('overview-online').textContent = data.onlineNow;
        document.getElementById('overview-requests').textContent = data.totalRequests;
      } catch (err) {
        // apiFetch gère déjà la redirection vers le login en cas de 401
      }
    }

    // Sans ça, un admin ne découvre que la persistance GitHub était mal
    // configurée (token/repo absents ou invalides) qu'après un redéploiement
    // qui a effacé des données jamais synchronisées à distance.
    function renderStorageStatusLine(el, s, label) {
      if (!s.enabled) {
        el.style.background = '#fdf3cd';
        el.style.color = '#7a5b00';
        el.textContent = `⚠️ ${label} : persistance GitHub désactivée (GITHUB_TOKEN / GITHUB_DATA_REPO non définis) — perdu au prochain redémarrage.`;
        return;
      }

      if (s.lastPushOk === false) {
        el.style.background = '#fbe1e1';
        el.style.color = '#8a1f1f';
        el.textContent = `❌ ${label} : persistance GitHub active (${s.repo}) mais le dernier envoi a échoué : ${s.lastPushError}`;
        return;
      }

      el.style.background = '#e3f6e8';
      el.style.color = '#1a7a3c';
      el.textContent = `✅ ${label} : persistance GitHub active (${s.repo}, branche ${s.branch})`
        + (s.lastPushAt ? ` — dernière sauvegarde : ${new Date(s.lastPushAt).toLocaleString('fr-FR')}` : ' — rien sauvegardé encore.');
    }

    async function loadStorageStatus() {
      try {
        const res = await apiFetch('/api/admin/storage-status');
        const s = await res.json();
        renderStorageStatusLine(document.getElementById('storage-status-licenses'), s.licenses, 'Licences');
        renderStorageStatusLine(document.getElementById('storage-status-whatsapp'), s.whatsapp, 'Session WhatsApp');
        renderStorageStatusLine(document.getElementById('storage-status-telegram'), s.telegram, 'Session Telegram');
      } catch (err) {
        // apiFetch gère déjà la redirection vers le login en cas de 401
      }
    }

    // Liste complète mise en cache pour filtrer la recherche sans refaire
    // d'appel réseau à chaque frappe, et clé actuellement ouverte dans le
    // panneau "Gérer" (un seul panneau ouvert à la fois, plus simple à gérer
    // que des IDs uniques par ligne).
    let allLicenses = [];
    let managingKey = null;

    // Cause affichée pour aider l'admin à diagnostiquer une clé sans état
    // "OK" apparent : dérivée en direct des champs de la licence (jamais
    // stockée telle quelle) sauf pour l'appareil refusé, seul événement
    // ponctuel non reconstituable après coup — voir licenses.js#recordFailure.
    function computeCause(lic) {
      if (!lic.active) return { text: 'Désactivée manuellement', bad: true };
      if (lic.expiresAt && new Date(lic.expiresAt).getTime() < Date.now()) {
        return { text: 'Expirée le ' + new Date(lic.expiresAt).toLocaleDateString('fr-FR'), bad: true };
      }
      if (lic.lastFailureReason === 'DEVICE_MISMATCH' && lic.lastFailureAt) {
        const minutesAgo = Math.max(0, Math.round((Date.now() - new Date(lic.lastFailureAt).getTime()) / 60000));
        return { text: 'Appareil refusé (tentative il y a ' + minutesAgo + ' min)', bad: true };
      }
      return { text: 'OK', bad: false };
    }

    function matchesSearch(lic, query) {
      if (!query) return true;
      const haystack = (lic.key + ' ' + (lic.note || '')).toLowerCase();
      return haystack.includes(query.toLowerCase());
    }

    async function loadLicenses() {
      try {
        const res = await apiFetch('/api/admin/licenses');
        allLicenses = await res.json();
        renderLicenses();
      } catch (err) {
        document.getElementById('licenses-body').innerHTML =
          '<tr><td colspan="11" class="empty">Erreur lors du chargement des licences.</td></tr>';
      }
    }

    function renderLicenses() {
      const tbody = document.getElementById('licenses-body');
      const query = document.getElementById('license-search').value.trim();
      const list = Array.isArray(allLicenses) ? allLicenses.filter((lic) => matchesSearch(lic, query)) : [];
      tbody.innerHTML = '';

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="11" class="empty">'
          + (query ? 'Aucune clé ne correspond à la recherche.' : 'Aucune clé générée.') + '</td></tr>';
        return;
      }

      list.forEach((lic) => {
        const tr = document.createElement('tr');

        const keyTd = document.createElement('td');
        keyTd.textContent = lic.key;

        const createdTd = document.createElement('td');
        createdTd.textContent = new Date(lic.createdAt).toLocaleDateString();

        const expTd = document.createElement('td');
        expTd.textContent = lic.expiresAt ? new Date(lic.expiresAt).toLocaleDateString() : 'Illimitée';

        const statusTd = document.createElement('td');
        statusTd.textContent = lic.active ? 'Active' : 'Désactivée';
        statusTd.className = lic.active ? 'status-delivered' : 'status-failed';

        const cause = computeCause(lic);
        const causeTd = document.createElement('td');
        causeTd.textContent = cause.text;
        causeTd.className = cause.bad ? 'cause-bad' : 'cause-ok';

        const onlineTd = document.createElement('td');
        const onlineBadge = document.createElement('span');
        onlineBadge.className = 'badge ' + (lic.online ? 'connected' : 'disconnected');
        onlineBadge.textContent = lic.online ? 'En ligne' : 'Hors ligne';
        onlineTd.appendChild(onlineBadge);

        const requestsTd = document.createElement('td');
        requestsTd.textContent = lic.requestCount || 0;

        const modulesTd = document.createElement('td');
        const modules = Array.isArray(lic.allowedModules) ? lic.allowedModules : [];
        modulesTd.textContent = modules.length > 0 ? modules.map((m) => MODULE_LABELS[m] || m).join(', ') : 'Aucun';

        const deviceTd = document.createElement('td');
        const deviceBadge = document.createElement('span');
        deviceBadge.className = 'badge ' + (lic.boundDeviceId ? 'connected' : 'disconnected');
        deviceBadge.textContent = lic.boundDeviceId ? 'Lié' : 'Libre';
        deviceTd.appendChild(deviceBadge);

        const noteTd = document.createElement('td');
        noteTd.textContent = lic.note || '-';

        const actionTd = document.createElement('td');
        const manageBtn = document.createElement('button');
        manageBtn.type = 'button';
        manageBtn.textContent = managingKey === lic.key ? 'Fermer' : 'Gérer';
        manageBtn.addEventListener('click', () => {
          managingKey = managingKey === lic.key ? null : lic.key;
          renderLicenses();
        });
        actionTd.appendChild(manageBtn);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.style.marginLeft = '0.5rem';
        btn.textContent = lic.active ? 'Désactiver' : 'Activer';
        btn.addEventListener('click', () => toggleLicense(lic.key, !lic.active));
        actionTd.appendChild(btn);

        if (lic.boundDeviceId) {
          const unbindBtn = document.createElement('button');
          unbindBtn.type = 'button';
          unbindBtn.style.marginLeft = '0.5rem';
          unbindBtn.textContent = "Libérer l'appareil";
          unbindBtn.addEventListener('click', () => unbindDevice(lic.key));
          actionTd.appendChild(unbindBtn);
        }

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.style.marginLeft = '0.5rem';
        deleteBtn.style.background = '#c0392b';
        deleteBtn.style.color = '#fff';
        deleteBtn.textContent = 'Supprimer';
        deleteBtn.addEventListener('click', () => deleteLicenseKey(lic.key));
        actionTd.appendChild(deleteBtn);

        [keyTd, createdTd, expTd, statusTd, causeTd, onlineTd, requestsTd, modulesTd, deviceTd, noteTd, actionTd].forEach((td) => tr.appendChild(td));
        tbody.appendChild(tr);

        if (managingKey === lic.key) {
          tbody.appendChild(buildManageRow(lic));
        }
      });
    }

    document.getElementById('license-search').addEventListener('input', renderLicenses);

    // Panneau "Gérer" : modules autorisés + renouvellement de la durée de
    // validité pour une clé déjà émise, en un seul enregistrement — voir
    // POST /api/admin/licenses/:key/update (licenses.js#updateLicenseModules
    // et #renewLicense). Le sélecteur de durée démarre sur "Ne pas modifier"
    // : la date d'expiration n'est touchée que si l'admin choisit
    // explicitement une unité.
    function buildManageRow(lic) {
      const tr = document.createElement('tr');
      tr.className = 'manage-row';
      const td = document.createElement('td');
      td.colSpan = 11;

      const modulesField = document.createElement('div');
      modulesField.className = 'field';
      const modulesLabel = document.createElement('label');
      modulesLabel.textContent = 'Modules autorisés';
      modulesField.appendChild(modulesLabel);
      const currentModules = Array.isArray(lic.allowedModules) ? lic.allowedModules : [];
      const moduleCheckboxes = {};
      Object.keys(MODULE_LABELS).forEach((m) => {
        const label = document.createElement('label');
        label.className = 'mod';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = currentModules.includes(m);
        moduleCheckboxes[m] = cb;
        label.appendChild(cb);
        label.appendChild(document.createTextNode(' ' + MODULE_LABELS[m]));
        modulesField.appendChild(label);
      });
      td.appendChild(modulesField);

      const durationField = document.createElement('div');
      durationField.className = 'field';
      const durationLabel = document.createElement('label');
      durationLabel.textContent = 'Renouveler la durée de validité (à partir de maintenant)';
      durationField.appendChild(durationLabel);
      const row = document.createElement('div');
      row.className = 'row';
      const valueInput = document.createElement('input');
      valueInput.type = 'number';
      valueInput.min = '0';
      valueInput.value = '30';
      valueInput.style.maxWidth = '120px';
      const unitSelect = document.createElement('select');
      [
        ['none', 'Ne pas modifier'],
        ['hours', 'Heure(s)'],
        ['days', 'Jour(s)'],
        ['months', 'Mois'],
        ['years', 'Année(s)'],
        ['unlimited', 'Illimitée'],
      ].forEach(([value, label]) => {
        const opt = document.createElement('option');
        opt.value = value;
        opt.textContent = label;
        unitSelect.appendChild(opt);
      });
      row.appendChild(wrapField(valueInput));
      row.appendChild(wrapField(unitSelect));
      durationField.appendChild(row);
      td.appendChild(durationField);

      const feedback = document.createElement('p');
      feedback.hidden = true;
      td.appendChild(feedback);

      const saveBtn = document.createElement('button');
      saveBtn.type = 'button';
      saveBtn.className = 'primary-btn';
      saveBtn.textContent = 'Enregistrer';
      saveBtn.addEventListener('click', async () => {
        const allowedModules = Object.keys(moduleCheckboxes).filter((m) => moduleCheckboxes[m].checked);
        const body = { allowedModules };
        const unit = unitSelect.value;
        if (unit !== 'none') {
          body.expiresAt = unit === 'unlimited' ? null : computeExpiresAtFromInputs(valueInput.value, unit);
        }
        saveBtn.disabled = true;
        try {
          await apiFetch('/api/admin/licenses/' + encodeURIComponent(lic.key) + '/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          managingKey = null;
          loadLicenses();
        } catch (err) {
          feedback.hidden = false;
          feedback.style.color = '#c0392b';
          feedback.textContent = 'Erreur lors de l\'enregistrement.';
          saveBtn.disabled = false;
        }
      });
      td.appendChild(saveBtn);

      const cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.style.marginLeft = '0.5rem';
      cancelBtn.textContent = 'Annuler';
      cancelBtn.addEventListener('click', () => { managingKey = null; renderLicenses(); });
      td.appendChild(cancelBtn);

      tr.appendChild(td);
      return tr;
    }

    function wrapField(el) {
      const div = document.createElement('div');
      div.className = 'field';
      div.appendChild(el);
      return div;
    }

    async function toggleLicense(key, active) {
      try {
        await apiFetch('/api/admin/licenses/' + encodeURIComponent(key) + '/toggle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ active }),
        });
        loadLicenses();
      } catch (err) {
        // la liste reste inchangée, l'utilisateur peut réessayer
      }
    }

    // Détache la clé de l'appareil sur lequel elle est actuellement liée —
    // à utiliser quand un client change d'appareil légitimement (perte,
    // changement de téléphone...). La clé se relie automatiquement au
    // prochain appareil qui l'utilisera.
    async function unbindDevice(key) {
      if (!window.confirm('Libérer cette clé de son appareil actuel ? Elle pourra être réutilisée sur un nouvel appareil.')) {
        return;
      }
      try {
        await apiFetch('/api/admin/licenses/' + encodeURIComponent(key) + '/unbind-device', {
          method: 'POST',
        });
        loadLicenses();
      } catch (err) {
        // la liste reste inchangée, l'utilisateur peut réessayer
      }
    }

    async function deleteLicenseKey(key) {
      if (!window.confirm('Supprimer définitivement la clé ' + key + ' ? Cette action est irréversible.')) {
        return;
      }
      try {
        await apiFetch('/api/admin/licenses/' + encodeURIComponent(key), {
          method: 'DELETE',
        });
        loadLicenses();
        loadOverview();
      } catch (err) {
        // la liste reste inchangée, l'utilisateur peut réessayer
      }
    }

    document.getElementById('select-all-modules-btn').addEventListener('click', () => {
      document.querySelectorAll('.new-license-module').forEach((cb) => { cb.checked = true; });
    });
    document.getElementById('deselect-all-modules-btn').addEventListener('click', () => {
      document.querySelectorAll('.new-license-module').forEach((cb) => { cb.checked = false; });
    });

    // Durée composée librement (heures/jours/mois/années) plutôt que des
    // préréglages fixes — un admin peut viser une expiration précise à
    // l'heure près, ou sur plusieurs années, sans valeur imposée. Partagée
    // entre le formulaire de création et le panneau "Gérer" (renouvellement).
    function computeExpiresAtFromInputs(rawAmount, unit) {
      if (unit === 'unlimited') return null;

      const amount = parseInt(rawAmount, 10) || 0;
      const date = new Date();

      if (unit === 'hours') date.setHours(date.getHours() + amount);
      else if (unit === 'days') date.setDate(date.getDate() + amount);
      else if (unit === 'months') date.setMonth(date.getMonth() + amount);
      else if (unit === 'years') date.setFullYear(date.getFullYear() + amount);

      return date.toISOString();
    }

    function computeExpiresAt() {
      const unit = document.getElementById('new-license-duration-unit').value;
      const amount = document.getElementById('new-license-duration-value').value;
      return computeExpiresAtFromInputs(amount, unit);
    }

    function showGenerateFeedback(message, isError) {
      const el = document.getElementById('generate-feedback');
      el.hidden = false;
      el.textContent = message;
      el.style.color = isError ? '#c0392b' : '#1a7a3c';
    }

    async function createOneLicense(expiresAt, note, allowedModules) {
      const res = await apiFetch('/api/admin/licenses', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ expiresAt, note, allowedModules }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Échec de la génération.');
      return data;
    }

    // Génère N clés d'un coup (même durée, mêmes modules, même note) — pour
    // distribuer rapidement des accès à plusieurs utilisateurs en une seule
    // action plutôt que de répéter le formulaire.
    document.getElementById('generate-license-btn').addEventListener('click', async () => {
      const note = document.getElementById('new-license-note').value.trim();
      const allowedModules = Array.from(document.querySelectorAll('.new-license-module:checked')).map((cb) => cb.value);
      const expiresAt = computeExpiresAt();
      const quantity = Math.min(100, Math.max(1, parseInt(document.getElementById('new-license-quantity').value, 10) || 1));

      if (allowedModules.length === 0) {
        showGenerateFeedback('Sélectionnez au moins un module (WhatsApp et/ou Telegram).', true);
        return;
      }

      const btn = document.getElementById('generate-license-btn');
      btn.disabled = true;
      showGenerateFeedback(`Génération de ${quantity} clé(s) en cours...`, false);

      const createdKeys = [];
      try {
        for (let i = 0; i < quantity; i += 1) {
          const license = await createOneLicense(expiresAt, note, allowedModules);
          createdKeys.push(license.key);
        }
        showGenerateFeedback(
          quantity === 1
            ? 'Clé générée : ' + createdKeys[0]
            : quantity + ' clés générées : ' + createdKeys.join(', '),
          false,
        );
        document.getElementById('new-license-note').value = '';
        document.querySelectorAll('.new-license-module').forEach((cb) => { cb.checked = false; });
        loadLicenses();
        loadOverview();
        loadStorageStatus();
      } catch (err) {
        showGenerateFeedback(
          createdKeys.length > 0
            ? `${createdKeys.length}/${quantity} clé(s) générée(s) avant l'erreur : ${err.message}`
            : err.message,
          true,
        );
        loadLicenses();
        loadOverview();
        loadStorageStatus();
      } finally {
        btn.disabled = false;
      }
    });

    function init() {
      loadOverview();
      loadLicenses();
      loadStorageStatus();
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(() => { loadOverview(); loadLicenses(); loadStorageStatus(); }, 8000);
    }

    tryAutoLogin().then((ok) => { if (ok) init(); });
  </script>
</body>
</html>
