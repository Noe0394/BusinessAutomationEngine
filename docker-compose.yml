services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: cyrus-super-assistant-backend
    container_name: cyrus-super-assistant-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      # PORT=3000 ici uniquement pour ce déploiement VPS (docker-compose) —
      # le Dockerfile lui-même reste à EXPOSE 10000 (valeur par défaut pour
      # Render/Koyeb, voir README.md), sans conflit puisque PORT est déjà lu
      # dynamiquement par index.js (process.env.PORT || 10000).
      - PORT=3000
      # Les credentials ET les clés Signal Baileys doivent rester ensemble
      # sur le volume whatsapp_auth. Un chemin absolu évite qu'un changement
      # de WORKDIR ne les place sur le disque éphémère du conteneur.
      - AUTH_DIR=/app/auth_info_baileys
      # Persistance des LICENCES (licenses.json) et de la MÉMOIRE 7 JOURS
      # (ai_engine_data) dans le volume nommé app_data ci-dessous — sinon ces
      # fichiers vivent sur le disque ÉPHÉMÈRE du conteneur et sont effacés à
      # chaque rebuild (docker-compose up -d --build), ce qui "rejette"
      # systématiquement les clés générées après le redéploiement ET efface la
      # mémoire conversationnelle 7 jours (bug réel constaté en production).
      - LICENSES_PATH=/app/data/licenses.json
      - AI_ENGINE_STORAGE_DIR=/app/data/ai_engine
    env_file:
      # Créer ce fichier sur le VPS à partir de .env.example (jamais commité,
      # voir .gitignore) — toutes les clés API + PUBLIC_BASE_URL (l'IP/domaine
      # public de ce VPS) + DASHBOARD_ORIGIN (l'origine Vercel autorisée).
      - .env
    volumes:
      # Persistent local storage for the complete Baileys auth folder:
      # credentials and Signal keys must remain together. A creds.json-only
      # backup cannot restore this session safely.
      - whatsapp_auth:/app/auth_info_baileys
      - telegram_sessions:/app/telegram_sessions
      # Compte de service Firebase (voir lib/firebaseSync.js) : bind mount
      # en lecture seule d'un fichier déposé UNE FOIS sur ce serveur, HORS
      # git (comme .env) — survit aux redéploiements (git pull + rebuild)
      # tant que le serveur lui-même n'est pas recréé. FIREBASE_SERVICE_ACCOUNT_PATH
      # dans .env doit alors pointer vers le chemin EN CONTENEUR à droite du ":"
      # (ex: /app/firebase-service-account.json), pas vers le chemin sur l'hôte.
      # Commenter ces 2 lignes (et laisser FIREBASE_SERVICE_ACCOUNT_PATH vide)
      # tant que ce fichier n'a pas été déposé sur le serveur : sans le mount,
      # le chemin serait introuvable dans le conteneur et firebaseSync resterait
      # simplement désactivé (no-op), sans jamais faire planter le démarrage.
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
      # Médias générés (affiches/vidéos IA, voir lib/media/imageLinkStore.js)
      # : anciennement en mémoire (perdus à CHAQUE redémarrage du conteneur,
      # y compris un simple redéploiement) — persistés ici pour survivre aux
      # redéploiements, avec la même purge automatique par TTL (6h) qu'avant.
      - generated_media:/app/generated_media
      # Données applicatives (licences + mémoire 7 jours/agent intelligent) :
      # le volume nommé devra être initialisé UNE FOIS avec les données du
      # conteneur précédent avant le premier rebuild (voir deploy.sh) pour ne
      # pas perdre les licences déjà émises.
      - app_data:/app/data

volumes:
  whatsapp_auth:
  telegram_sessions:
  generated_media:
  app_data:
