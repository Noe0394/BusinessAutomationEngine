services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: cyrus-super-assistant-backend
    container_name: cyrus-super-assistant-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      # PORT=3000 ici uniquement pour ce déploiement VPS (docker-compose) —
      # le Dockerfile lui-même reste à EXPOSE 10000 (valeur par défaut pour
      # Render/Koyeb, voir README.md), sans conflit puisque PORT est déjà lu
      # dynamiquement par index.js (process.env.PORT || 10000).
      - PORT=3000
    env_file:
      # Créer ce fichier sur le VPS à partir de .env.example (jamais commité,
      # voir .gitignore) — toutes les clés API + PUBLIC_BASE_URL (l'IP/domaine
      # public de ce VPS) + DASHBOARD_ORIGIN (l'origine Vercel autorisée).
      - .env
    volumes:
      # Persistance locale entre redémarrages du conteneur (docker-compose
      # restart, mise à jour d'image) — complète, ne remplace pas, la
      # sauvegarde GitHub (githubStore.js) qui reste la seule protection en
      # cas de perte du volume lui-même (VPS recréé, disque changé).
      - whatsapp_auth:/app/auth_info_baileys
      - telegram_sessions:/app/telegram_sessions
      # Compte de service Firebase (voir lib/firebaseSync.js) : bind mount
      # en lecture seule d'un fichier déposé UNE FOIS sur ce serveur, HORS
      # git (comme .env) — survit aux redéploiements (git pull + rebuild)
      # tant que le serveur lui-même n'est pas recréé. FIREBASE_SERVICE_ACCOUNT_PATH
      # dans .env doit alors pointer vers le chemin EN CONTENEUR à droite du ":"
      # (ex: /app/firebase-service-account.json), pas vers le chemin sur l'hôte.
      # Commenter ces 2 lignes (et laisser FIREBASE_SERVICE_ACCOUNT_PATH vide)
      # tant que ce fichier n'a pas été déposé sur le serveur : sans le mount,
      # le chemin serait introuvable dans le conteneur et firebaseSync resterait
      # simplement désactivé (no-op), sans jamais faire planter le démarrage.
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro

volumes:
  whatsapp_auth:
  telegram_sessions:
